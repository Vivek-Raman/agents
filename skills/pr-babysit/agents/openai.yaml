interface:
  display_name: "PR Babysitter"
  short_description: "Watch PR review comments, CI, and merge conflicts"
  default_prompt: "Babysit the current PR. Prefer the harness' GitHub tooling and its native monitoring when available, falling back to gh only when no usable GitHub tooling exists. Address and resolve published review feedback, diagnose CI, fix branch-related failures, and rerun flaky failures up to three times per head SHA. Keep watching until the PR closes or a user decision is needed."
